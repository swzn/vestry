name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository, so keep the token read-only.
permissions:
  contents: read

# Cancel superseded runs on pull requests and other refs, but let every run on main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The tests spawn real git hooks; a hang should fail fast instead of running for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24.19.0', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # One stable check to require in the branch ruleset. It stays valid when the test matrix changes.
  # `if: always()` matters: without it a failed matrix would leave this job skipped, and GitHub
  # counts a skipped required check as passing.
  ci-passed:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to have succeeded
        run: |
          echo "test jobs: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
