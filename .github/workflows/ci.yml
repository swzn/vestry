name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository, so keep the token read-only.
permissions:
  contents: read

# Cancel superseded runs on pull requests and other refs, but let every run on main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The tests spawn real git hooks; a hang should fail fast instead of running for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24.19.0', 'latest']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Packs the CLI as `npm publish` would, installs the tarball into an empty project and runs the README
  # walkthrough against it. Uses the minimum supported Node, since that is what a release must work on.
  pack-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run pack:smoke

  # One stable check to require in the branch ruleset. It stays valid when the matrices change.
  # `if: always()` matters: without it a failed job would leave this one skipped, and GitHub
  # counts a skipped required check as passing.
  ci-passed:
    if: always()
    needs: [test, pack-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        run: |
          echo "test: ${{ needs.test.result }}, pack-smoke: ${{ needs.pack-smoke.result }}"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.pack-smoke.result }}" = "success"
